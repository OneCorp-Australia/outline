name: Build & publish to GHCR

# Builds the OneCorp custom Outline image (with Fireflies embed) and pushes it to
# ghcr.io/onecorp-australia/outline so the Hostinger VPS can pull it.
#
# Triggers:
#   - push to main / feature/* branches
#   - manual via "Run workflow" in the Actions UI
#
# Build is single-arch (linux/amd64) because the Hostinger VPS is x86_64.
# To add arm64 later, mirror the upstream `docker.yml` two-job pattern.

on:
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  BASE_IMAGE_NAME: ${{ github.repository }}-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image refs
        id: refs
        run: |
          echo "image=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"
          echo "base_image=${REGISTRY}/${BASE_IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH_SAFE=$(echo "${{ github.ref_name }}" | tr '/' '-')
          IMAGE="${{ steps.refs.outputs.image }}"
          BASE="${{ steps.refs.outputs.base_image }}"

          # Runtime image tags
          TAGS="$IMAGE:$BRANCH_SAFE,$IMAGE:$BRANCH_SAFE-$SHA_SHORT"
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "runtime_tags=$TAGS" >> "$GITHUB_OUTPUT"

          # Base image tag (single moving tag is fine — runtime references by digest)
          echo "base_tag=$BASE:$BRANCH_SAFE" >> "$GITHUB_OUTPUT"

      - name: Build & push base image
        id: base_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ steps.tags.outputs.base_tag }}
          platforms: linux/amd64
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build & push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.runtime_tags }}
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ steps.tags.outputs.base_tag }}@${{ steps.base_build.outputs.digest }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Summary
        run: |
          echo "## OneCorp Outline image built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Runtime tags pushed:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.tags.outputs.runtime_tags }}" | tr ',' '\n' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull on the VPS with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.refs.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
